<style>:root{color-scheme:light;--paper:#fff;--page:#f7f9f7;--ink:#141815;--muted:#5b645d;--green:#176023;--soft:#eaf2e9;--line:#dce3dc}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#171b18;--page:#0f1210;--ink:#eef1ec;--muted:#9ba59c;--green:#5bc46c;--soft:#16231a;--line:#2a312b}}*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--page);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{width:100%;max-width:420px;text-align:center;animation:in .5s cubic-bezier(.2,.8,.2,1) both}.logo{display:inline-flex;width:84px;height:84px;padding:8px;border-radius:50%;background:#fff;box-shadow:0 6px 24px rgb(0 0 0 / 8%);margin-bottom:28px}.logo img{width:100%;height:100%;object-fit:contain}.code{display:flex;align-items:center;justify-content:center;gap:6px;font:400 88px/1 Georgia,"Times New Roman",serif;color:var(--green);letter-spacing:-2px}.plate{width:84px;height:84px;color:var(--green)}.plate circle:first-child{fill:var(--soft)}h1{margin:22px 0 8px;font:400 26px/1.2 Georgia,"Times New Roman",serif}p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}.en{margin-top:4px;font-size:13px}a.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:28px;min-height:50px;padding:12px 26px;border-radius:12px;background:#176023;color:#fff;font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,transform .1s}a.button:hover{background:#1f7a2e}a.button:active{transform:scale(.98)}a.button:focus-visible{outline:3px solid var(--green);outline-offset:3px}a.button svg{width:18px;height:18px}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){main{animation:none}}</style>
</head>
